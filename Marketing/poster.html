<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lilita;src:url(../Assets/Resources/Fonts/LilitaOne.ttf)}
@font-face{font-family:Fig;src:url(../Assets/Resources/Fonts/Figtree.ttf)}
@font-face{font-family:Suits;src:url(../Assets/Resources/Fonts/Suits.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#ffd84d;font-family:Fig;color:#111;position:relative}
.disc{position:absolute;border-radius:50%}
.d1{width:1100px;height:1100px;background:#ffc21a;right:-520px;top:180px}
.d2{width:700px;height:700px;background:#ffe78a;left:-380px;bottom:-120px}
.top{position:absolute;top:70px;left:0;right:0;text-align:center}
.eyebrow{display:inline-block;font:900 26px Fig;letter-spacing:6px;background:#111;color:#fff;border-radius:40px;padding:10px 26px}
h1{font:400 150px/0.9 Lilita;margin-top:26px}
.and{display:block;font:900 30px Fig;letter-spacing:16px;margin:14px 0 10px}
.r{color:#ff5a5f;-webkit-text-stroke:5px #111;paint-order:stroke fill;text-shadow:9px 9px 0 #111}
.tag{font:800 36px Fig;margin-top:24px}
.tag b{font-family:Suits}
.phones{position:absolute;left:0;right:0;top:600px;height:560px}
.ph{position:absolute;width:240px;height:520px;border-radius:40px;background:#111;padding:9px;box-shadow:12px 14px 0 #111}
.ph img{width:100%;height:100%;border-radius:32px;object-fit:cover;object-position:top}
.p1{left:110px;top:60px;transform:rotate(-8deg)}
.p2{left:415px;top:0;z-index:2;transform:scale(1.08)}
.p3{left:720px;top:60px;transform:rotate(8deg)}
.burst{position:absolute;left:330px;top:560px;z-index:3;transform:rotate(-10deg);font:400 54px Lilita;color:#3ddc97;-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:5px 5px 0 #111}
.chips{position:absolute;bottom:72px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.chip{font:900 25px Fig;background:#fff;border:4px solid #111;border-radius:40px;padding:12px 24px;box-shadow:5px 5px 0 #111}
.foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;font:800 22px Fig;letter-spacing:3px}
</style></head><body>
<div class="disc d1"></div><div class="disc d2"></div>
<div class="top">
  <span class="eyebrow">NEW GAME · OUT NOW</span>
  <h1>Tuntum<span class="and">ANAA</span><span class="r">Kɔkɔɔ</span></h1>
  <p class="tag">Black <b>♠♣</b> or red <b>♥♦</b>? Call the next card.</p>
</div>
<div class="phones">
  <div class="ph p1"><img src="screens/2-your-turn.png"></div>
  <div class="ph p2"><img src="screens/4-three-in-a-row.png"></div>
  <div class="ph p3"><img src="screens/6-winner.png"></div>
</div>
<div class="burst">3 IN A ROW!</div>
<div class="chips"><span class="chip">vs Computer</span><span class="chip">Pass &amp; Play</span><span class="chip">Online with friends</span></div>
<p class="foot">ANDROID · IPHONE · WEB</p>
</body></html>
